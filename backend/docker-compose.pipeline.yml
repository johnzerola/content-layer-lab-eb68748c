name: content-layer-lab-cleaner-pipeline

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: content-layer-lab-cleaner-api:latest
    container_name: cleaner-api
    restart: unless-stopped
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips '*'
    environment: &cleaner-env
      CLEANER_ENV: production
      CLEANER_WORKER_SECRET: ${CLEANER_WORKER_SECRET:?defina no .env}
      CLEANER_STORAGE: /app/storage
      CLEANER_DEVICE: cpu
      USE_CELERY: "1"
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?defina no .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?defina no .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-cleaner-jobs}
      MINIO_SECURE: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:?defina no .env}
      CLEANER_CALLBACK_ORIGINS: ${CLEANER_CALLBACK_ORIGINS:?defina no .env}
      CLEANER_ALLOWED_HOSTS: ${CLEANER_ALLOWED_HOSTS:?defina no .env}
      CLEANER_MAX_UPLOAD_GB: ${CLEANER_MAX_UPLOAD_GB:-2}
      CLEANER_MAX_DURATION_SECONDS: ${CLEANER_MAX_DURATION_SECONDS:-3600}
      CLEANER_MAX_WIDTH: ${CLEANER_MAX_WIDTH:-3840}
      CLEANER_MAX_HEIGHT: ${CLEANER_MAX_HEIGHT:-2160}
      CLEANER_MAX_FPS: ${CLEANER_MAX_FPS:-60}
      CLEANER_STORAGE_QUOTA_GB: ${CLEANER_STORAGE_QUOTA_GB:-100}
      CLEANER_MIN_FREE_GB: ${CLEANER_MIN_FREE_GB:-20}
      CLEANER_RETENTION_HOURS: ${CLEANER_RETENTION_HOURS:-72}
      CLEANER_MAX_CONCURRENT_JOBS: ${CLEANER_MAX_CONCURRENT_JOBS:-20}
      CLEANER_RATE_LIMIT_PER_MINUTE: ${CLEANER_RATE_LIMIT_PER_MINUTE:-120}
      CLEANER_TEXT_DETECTOR: ${CLEANER_TEXT_DETECTOR:-PP-OCRv5_server_det}
      CLEANER_OCR_DEVICE: cpu
    ports:
      - "127.0.0.1:${CLEANER_BIND_PORT:-8095}:8000"
    volumes:
      - ./data/storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - cleaner-net
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  worker-detect:
    image: content-layer-lab-cleaner-api:latest
    container_name: cleaner-worker-detect
    restart: unless-stopped
    command: celery -A app.workers.tasks:celery_app worker -Q detect -c 1 --loglevel=info
    environment:
      <<: *cleaner-env
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - ./data/storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - cleaner-net
    logging: *logging

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: content-layer-lab-cleaner-worker-gpu:latest
    container_name: cleaner-worker-gpu
    restart: unless-stopped
    command: celery -A app.workers.tasks:celery_app worker -Q gpu-quality,gpu-max -c 1 --loglevel=info
    environment:
      CLEANER_ENV: production
      CLEANER_WORKER_SECRET: ${CLEANER_WORKER_SECRET:?defina no .env}
      CLEANER_STORAGE: /app/storage
      CLEANER_DEVICE: cuda
      USE_CELERY: "1"
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?defina no .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?defina no .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-cleaner-jobs}
      MINIO_SECURE: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:?defina no .env}
      CLEANER_CALLBACK_ORIGINS: ${CLEANER_CALLBACK_ORIGINS:?defina no .env}
      CLEANER_ALLOWED_HOSTS: ${CLEANER_ALLOWED_HOSTS:?defina no .env}
      PROPAINTER_ROOT: /opt/ProPainter
      PROPAINTER_WEIGHTS_DIR: /app/models
      PROPAINTER_MAX_SIDE: ${PROPAINTER_MAX_SIDE:-1280}
      PROPAINTER_FP16: "1"
      DIFFUERASER_ROOT: /opt/DiffuEraser
      DIFFUERASER_MODELS_ROOT: /app/max-models
      DIFFUERASER_MAX_SIDE: ${DIFFUERASER_MAX_SIDE:-960}
      CLEANER_AUTO_DIFFUERASER: ${CLEANER_AUTO_DIFFUERASER:-1}
    volumes:
      - ./data/gpu-storage:/app/storage
      - ./data/models:/app/models
      - ./data/max-models:/app/max-models
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "8gb"
    security_opt:
      - no-new-privileges:true
    networks:
      - cleaner-net
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: cleaner-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - cleaner-net
    logging: *logging

  minio:
    image: minio/minio:latest
    container_name: cleaner-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?defina no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?defina no .env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - cleaner-net
    logging: *logging

volumes:
  redis-data:
  minio-data:

networks:
  cleaner-net:
    name: content-layer-lab-cleaner-pipeline-net
    driver: bridge
