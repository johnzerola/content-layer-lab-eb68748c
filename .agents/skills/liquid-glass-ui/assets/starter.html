<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Glass starter</title>
    <!-- Pin @main to a release tag or commit before production. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/hwyuanzi/LiquidGlass-UI@main/src/liquid-glass.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 18% 20%, #ba6a86, transparent 38%),
          radial-gradient(circle at 82% 72%, #398b91, transparent 42%), #171a2a;
      }
      main {
        width: min(560px, 100%);
      }
    </style>
  </head>
  <body>
    <main>
      <liquid-glass-card
        heading="Project overview"
        link="#details"
        cta="View details"
        appearance="tinted"
      >
        <span slot="description">
          A calm glass surface that preserves hierarchy and readability.
        </span>
      </liquid-glass-card>
    </main>
    <script type="module">
      import "https://cdn.jsdelivr.net/gh/hwyuanzi/LiquidGlass-UI@main/src/liquid-glass.js";
    </script>
  </body>
</html>
